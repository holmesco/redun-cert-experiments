feature_extractor_config:
  max_num_keypoints: 1024
registration_config:
  certify: True
  verbose: True
  adjust_cost: True
  # Analytic centering parameters
  ac_params:
    verbose: True
    lin_solver: MFCG_LRP
    lin_solve_max_iter: 200
    lin_solve_tol: 1e-5
    delta: 1e-5
    rescale_lin_sys: False
    max_iter: 20
    # Early stopping local
    early_stop_angle: True
    max_angle: 1e-2
    # Perturbation parameters
    perturb_constraints: True
    perturb_cost: True
    eps_cost: 1e-5
    eps_constr: 1e-5
    # Preconditioner parameters
    lrp_params:
      tau: 1e-5
      method: SparseLDLT
    # Adaptive perturbation
    adaptive_perturb: False
    eps_mult_min: 1e-3
data_association_config:
  method: CLIPPER
  certify: True
  unweighted: False
  invariant_epsilon: 3.0e-1
  invariant_sigma: 1.5e-1
  # Analytic Centering for data association
  ac_params:
    verbose: True
    lin_solver: MFCG_LRP
    lin_solve_max_iter: 400
    lin_solve_tol: 1e-5
    delta: 1e-6
    rescale_lin_sys: False
    max_iter: 6
    # Early stopping local
    early_stop_angle: True
    max_angle: 5e-4
    # Perturbation parameters
    perturb_cost: True
    eps_cost: 1e-6
    perturb_constraints: True
    eps_constr: 1e-6
    # Preconditioner parameters
    lrp_params:
      tau: 1e-6
      method: SparseLDLT
    # Adaptive perturbation
    adaptive_perturb: True
    eps_mult_min: 1e-3