feature_extractor_config:
  max_num_keypoints: 250
data_association_config:
  method: RANSAC
  # method: CLIPPER_SDP
  certify: True
  unweighted: False
  invariant_epsilon: 3.0e-1
  invariant_sigma: 1.5e-1
  ransac_inlier_threshold: 1.8e-1
  ransac_num_iterations: 100
  ransac_num_sample_pts: 10
  # Analytic Centering for data association
  ac_params:
    verbose: True
    lin_solver: MFCG_LRP
    lin_solve_max_iter: 400
    lin_solve_tol: 1e-7
    delta: 1e-7
    rescale_lin_sys: False
    max_iter: 10
    # Early stopping local
    early_stop_angle: True
    max_angle: 5e-4
    # Perturbation parameters
    perturb_cost: True
    eps_cost: 1e-7
    perturb_constraints: True
    eps_constr: 1e-7
    # Preconditioner parameters
    lrp_params:
      tau: 1e-7
      method: SparseLDLT
    # Adaptive perturbation
    adaptive_perturb: True
    eps_mult_min: 1e-3