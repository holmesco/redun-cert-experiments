experiment_name: "adv_min_good_init"
experiment_type: ADVERSARIAL
ply_path: "data/bun10k.ply"
seed: 2
# Bounded normal noise parameters
noise_beta: 0.0554
noise_sigma: 0.01
# Sweep parameters
num_assocs: [100]
outlier_ratios: [0.25]
num_trials: 1
# turn off results storage
save_results: True
plot: True
# set offsets
translation: [1.2,0.5,0.0]
translation_adv: [[1.2,-0.5,0.0]]
rotation: [0.0,0.0,0.2]
rotation_adv: [[0.0,0.0,-0.2]]
# Poor init flag
poor_init: False
# Methods to run
methods: [CLIPPER]
# Data association config
data_association_config:
  invariant_epsilon: 0.0554
  invariant_sigma: 0.01
  ransac_inlier_threshold: 0.006
  certify: True
  method: CLIPPER
  ac_params:
    verbose: True
    lin_solver: MFCG_LRP
    lin_solve_max_iter: 200
    lin_solve_tol: 1e-8
    delta: 1e-7
    rescale_lin_sys: False
    max_iter: 10
    # Early stopping local
    early_stop_angle: True
    max_angle: 1e-5
    # Perturbation parameters
    perturb_cost: True
    eps_cost: 1e-7
    perturb_constraints: True
    eps_constr: 1e-7
    # Preconditioner parameters
    lrp_params:
      tau: 1e-7
      method: SparseLDLT
    # Adaptive perturbation
    adaptive_perturb: True
    eps_mult_min: 1e-3
