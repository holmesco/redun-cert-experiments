experiment_name: "benchmark_sweep_low"
experiment_type: CLIPPER_BENCHMARK
ply_path: "data/bun10k.ply"
seed: 0
# Bounded normal noise parameters
noise_sigma: 0.01
noise_beta: 0.0554
# Sweep parameters
num_assocs: [50, 100, 150, 200]
outlier_ratios: [0.1, 0.3, 0.5, 0.7]
num_trials: 10
# turn off results storage
save_results: True
plot: False
# Methods to run
methods: [CLIPPER, PMC, RANSAC]
# Data association config
data_association_config:
  invariant_epsilon: 0.05
  invariant_sigma: 0.015
  certify: True
  ransac_num_sample_pts: 6
  ransac_num_iterations: 200
  ransac_inlier_threshold: 0.025
  cpcert_params:
    verbose: True
    lin_solver: MFCG_LRP
    lin_solve_max_iter: 200
    lin_solve_tol: 1e-10
    delta: 1e-7
    rescale_lin_sys: False
    max_iter: 10
    # Early stopping local
    early_stop_angle: True
    max_angle: 5e-5
    # Perturbation parameters
    perturb_cost: True
    eps_cost: 1e-7
    perturb_constraints: True
    eps_constr: 1e-7
    # Preconditioner parameters
    lrp_params:
      tau: 1e-7
      method: SparseLDLT
    # Adaptive perturbation
    adaptive_perturb: True
    eps_mult_min: 1e-3
