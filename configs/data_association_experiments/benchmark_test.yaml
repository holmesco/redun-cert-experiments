experiment_name: "clipper_benchmark_test"
experiment_type: CLIPPER_BENCHMARK
ply_path: "data/bun10k.ply"
seed: 2
# Bounded normal noise parameters
noise_beta: 0.0554
noise_sigma: 0.01
# Sweep parameters
num_assocs: [200]
outlier_ratios: [0.9]
num_trials: 1
# turn off results storage
save_results: False
plot: False
# set translation offset
translation: [1.0,0.0,0.0]
# Get the global solution for comparison
get_global_solution: False
# Turn on registration
registration: True
# Methods to run
methods: [SDP]
# Data association config
data_association_config:
  invariant_epsilon: 0.05
  invariant_sigma: 0.015
  certify: True
  method: CLIPPER
  ac_params:
    verbose: True
    lin_solver: MFCG_LRP
    lin_solve_max_iter: 200
    lin_solve_tol: 1e-8
    delta: 1e-7
    rescale_lin_sys: False
    max_iter: 10
    # Early stopping local
    early_stop_angle: True
    max_angle: 1e-5
    # Perturbation parameters
    perturb_cost: True
    eps_cost: 1e-7
    perturb_constraints: False
    eps_constr: 1e-7
    # Preconditioner parameters
    lrp_params:
      tau: 1e-7
      method: SparseLDLT
    # Adaptive perturbation
    adaptive_perturb: True
    eps_mult_min: 1e-3
