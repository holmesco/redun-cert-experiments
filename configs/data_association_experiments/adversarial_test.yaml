experiment_name: "adversarial_test"
experiment_type: ADVERSARIAL
ply_path: "data/bun10k.ply"
seed: 2
# Bounded normal noise parameters
noise_beta: 0.0554
noise_sigma: 0.01
# Sweep parameters
num_assocs: [200]
outlier_ratios: [0.45]
num_trials: 20
# turn off results storage
save_results: False
# bad init
poor_initialization: False
# Ground truth transform
translation: [1.0, 0.1, 0.0]
rotation: [0.0,0.0,0.0]
# Adversarial Transform
translation_adv: [1.0, -0.1, 0.0]
rotation_adv: [0.0,0.0,0.0]
# Turn on plotting.
plot: True
# Data association config
data_association_config:
  method: CLIPPER
  invariant_epsilon: 0.05
  invariant_sigma: 0.015
  certify: True
  ac_params:
    verbose: True
    lin_solver: MFCG_LRP
    lin_solve_max_iter: 400
    lin_solve_tol: 1e-7
    delta: 1e-7
    rescale_lin_sys: False
    max_iter: 10
    # Early stopping local
    early_stop_angle: True
    max_angle: 1e-4
    # Perturbation parameters
    perturb_cost: True
    eps_cost: 1e-7
    perturb_constraints: True
    eps_constr: 1e-7
    # Preconditioner parameters
    lrp_params:
      tau: 1e-7
      method: SparseLDLT
    # Adaptive perturbation
    adaptive_perturb: True
    eps_mult_min: 1e-3