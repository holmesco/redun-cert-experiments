# Runs the sweep experiment over the invariant sigma parameter.
experiment_name: "invariant_sweep_ransac"
experiment_type: CLIPPER_BENCHMARK
ply_path: "data/bun10k.ply"
seed: 0
# Bounded normal noise parameters
noise_beta: 0.0554
noise_sigma: 0.01
# Sweep parameters
num_assocs: [100]
outlier_ratios: [0.5]
num_trials: 30
# turn off results storage
save_results: True
plot: False
# turn on registration
registration: True
#  --- Sweep parameters ---
invariant_mult_min: 0.01
invariant_mult_max: 100.0
invariant_mult_num: 30
# RANSAC parameter
ransac_thresh_multiplier: 0.5
# Methods to run
methods: [RANSAC]
# Data association config
data_association_config:
  invariant_epsilon: 0.0554
  invariant_sigma: 0.01
  # Set ransac params
  ransac_num_sample_pts: 10
  ransac_num_iterations: 500
  ransac_inlier_threshold: 0.005 # Overwritten
  certify: True
  # Turn off separate process for SDP (only required for bigger SDPs)
  spawn_process: False 
  ac_params:
    verbose: True
    lin_solver: MFCG_LRP
    lin_solve_max_iter: 200
    lin_solve_tol: 1e-8
    delta: 1e-7
    rescale_lin_sys: False
    max_iter: 10
    # Early stopping local
    early_stop_angle: True
    max_angle: 8e-5
    # Perturbation parameters
    perturb_cost: True
    eps_cost: 1e-7
    perturb_constraints: False
    eps_constr: 1e-7
    # Preconditioner parameters
    lrp_params:
      tau: 1e-7
      method: SparseLDLT
    # Adaptive perturbation
    adaptive_perturb: True
    eps_mult_min: 1e-3
